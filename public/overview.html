<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cortex — build environment overview</title>
<style>
  :root {
    --bg: #14101b;
    --wall: #33243f;
    --ink: #f3ece1;
    --dim: #9a93a8;
    --line: #2c2438;
    --mint: #8ff0c9;
    --amber: #f2b544;
    --coral: #ef7d62;
    --violet: #a08bf0;
    --teal: #5cc8c8;
    --green: #7fb069;
    --pink: #e573a6;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #08060c; color: var(--ink);
    font-family: var(--mono); overflow: hidden; }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
    transform-origin: center center;
    background:
      radial-gradient(1100px 560px at 50% -12%, #2c1f3c 0%, var(--bg) 58%, #0b0811 100%);
  }
  #stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(900px 520px at 50% 42%, transparent 40%, rgba(0,0,0,.55) 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .16; pointer-events: none;
    background-image:
      linear-gradient(to right, #3a2d4a 1px, transparent 1px),
      linear-gradient(to bottom, #3a2d4a 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(700px 460px at 50% 30%, #000 20%, transparent 78%);
  }
  .scan {
    position: absolute; inset: 0; pointer-events: none; z-index: 40; opacity: .22;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode: soft-light;
  }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 0; left: 0; right: 0; height: 56px; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 44px; font-size: 11px; letter-spacing: .22em; color: var(--dim);
    text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,.05);
    background: linear-gradient(to bottom, rgba(10,8,16,.75), rgba(10,8,16,0));
  }
  .hud-l { display: flex; align-items: center; gap: 12px; }
  .hud-mark {
    width: 18px; height: 18px; border-radius: 3px; display: grid; place-items: center;
    background: var(--mint); color: #10221b; font-size: 11px; font-weight: 700; letter-spacing: 0;
    box-shadow: 0 0 0 1px rgba(143,240,201,.35), 0 0 18px rgba(143,240,201,.35);
  }
  .hud-b { color: var(--ink); letter-spacing: .3em; }
  .hud-r { display: flex; align-items: center; gap: 18px; }
  #chapter { color: var(--mint); }
  #clock { font-variant-numeric: tabular-nums; color: var(--ink); opacity: .8; }

  /* ---------- scene ---------- */
  #scene {
    position: absolute; inset: 56px 0 78px; padding: 28px 52px;
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0; transition: opacity .35s ease;
  }
  #scene.in { opacity: 1; }

  .sc { display: contents; }

  .lab {
    display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px;
    font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--mint);
  }
  .lab span { color: var(--dim); letter-spacing: .08em; text-transform: none; font-size: 12px; }

  .fx { opacity: 0; transform: translateY(12px); transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
  .fx.in { opacity: 1; transform: none; }

  /* ---------- tape ---------- */
  .tape {
    position: absolute; left: 0; right: 0; bottom: 0; height: 78px; z-index: 30;
    padding: 0 44px 14px; background: linear-gradient(to top, rgba(8,6,12,.92), rgba(8,6,12,0));
  }
  .tape-bar { position: relative; height: 3px; background: rgba(255,255,255,.09); border-radius: 2px; overflow: hidden; }
  #playhead { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--teal), var(--mint));
    box-shadow: 0 0 14px rgba(143,240,201,.6); }
  #segs { display: flex; gap: 2px; margin-top: 12px; }
  #segs div {
    flex: 1; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: #6c6478;
    padding-top: 7px; border-top: 1px solid rgba(255,255,255,.07); transition: color .3s, border-color .3s;
  }
  #segs div.is-on { color: var(--ink); border-color: var(--mint); }

  /* ---------- shared bits ---------- */
  .card {
    border: 1px solid var(--line); border-radius: 10px; background: rgba(30,24,42,.72);
    box-shadow: 0 18px 40px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(255,255,255,.03); font-size: 11px; color: var(--dim);
    letter-spacing: .06em;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--tone, var(--mint)); }

  /* ---------- intro ---------- */
  .intro { height: 100%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 20px; }
  .intro h1 {
    margin: 0; font-size: 74px; letter-spacing: .34em; text-indent: .34em; font-weight: 700;
    color: #fbf6ee; text-shadow: 0 0 46px rgba(143,240,201,.25), 0 6px 0 #241a2b;
  }
  .intro .rule { width: 220px; height: 2px; background: linear-gradient(90deg, transparent, var(--mint), transparent); }
  .intro p { margin: 0; max-width: 640px; color: var(--dim); font-size: 13.5px; line-height: 1.85; letter-spacing: .04em; }
  .intro .flow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .intro .flow .chip { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* ---------- ask ---------- */
  .ask { max-width: 900px; margin: 12px auto 0; display: grid; gap: 18px; }
  .ask-row { display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--dim); letter-spacing: .16em; text-transform: uppercase; }
  .ask-card { padding: 24px 26px; font-size: 17px; line-height: 1.8; min-height: 132px; color: #efe7dc; }
  .ask-card .caret { display: inline-block; width: 9px; height: 19px; background: var(--mint); vertical-align: -3px; margin-left: 3px;
    animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .ask-meta { display: flex; gap: 10px; flex-wrap: wrap; }

  .say { margin-top: 18px; font-size: 13.5px; line-height: 1.65; color: #cfc6da; max-width: 940px; }
  .say b { color: var(--ink); font-weight: 600; }

  /* ---------- how it works ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .step { padding: 20px 18px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.02);
    display: grid; gap: 9px; align-content: start; }
  .step .n { font-size: 10px; letter-spacing: .22em; color: var(--mint); }
  .step b { font-size: 14.5px; line-height: 1.35; }
  .step p { margin: 0; font-size: 12px; line-height: 1.65; color: #a49bb3; }

  /* ---------- capabilities ---------- */
  .caps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cap { padding: 16px 18px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.02); }
  .cap b { display: block; font-size: 13px; letter-spacing: .04em; margin-bottom: 6px; }
  .cap p { margin: 0; font-size: 11.5px; line-height: 1.6; color: #a49bb3; }
  .cap i { display: block; width: 18px; height: 2px; background: var(--tone, var(--mint)); margin-bottom: 10px; }

  /* ---------- room ---------- */
  .room { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 8px; }
  .who { padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden; }
  .who::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--tone); opacity: .8; }
  .who .av {
    width: 46px; height: 46px; border-radius: 4px; background: color-mix(in srgb, var(--tone) 30%, #1d1728);
    border: 1px solid color-mix(in srgb, var(--tone) 55%, #1d1728);
    display: grid; place-items: center; font-size: 18px; color: #fff; letter-spacing: .02em;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 22px -4px var(--tone); } }
  .who b { font-size: 15px; letter-spacing: .06em; }
  .who .role { font-size: 11px; color: var(--dim); letter-spacing: .16em; text-transform: uppercase; }
  .who code { font-size: 10.5px; color: #7f768f; }
  .who .st { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--tone); display: flex; align-items: center; gap: 6px; }
  .who .what { margin: 0; font-size: 11px; line-height: 1.55; color: #9a91a9; }
  .who .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--tone); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .room-foot { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }

  /* ---------- plan ---------- */
  .units { display: grid; gap: 10px; margin-top: 6px; }
  .unit {
    display: grid; grid-template-columns: 68px 1fr 170px 122px; align-items: center; gap: 16px;
    padding: 16px 20px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.02);
  }
  .unit .id { font-size: 11px; color: #6f6780; letter-spacing: .14em; }
  .unit b { font-size: 14px; letter-spacing: .04em; }
  .unit .brief { margin-top: 5px; font-size: 11px; color: #8d849c; line-height: 1.4; }
  .note { margin-top: 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 12px; color: #b8afc6;
    line-height: 1.6; padding: 13px 16px; border-left: 2px solid rgba(143,240,201,.45);
    background: rgba(143,240,201,.04); border-radius: 0 8px 8px 0; }
  .note em { font-style: normal; color: var(--mint); letter-spacing: .16em; text-transform: uppercase; font-size: 9.5px;
    padding-top: 3px; white-space: nowrap; }
  .unit .file { font-size: 12px; color: var(--mint); }
  .unit .own { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  .scaffold { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .scaffold .f {
    padding: 7px 12px; border: 1px dashed #4b3f5f; border-radius: 6px; color: #cfc5e0;
    font-size: 11.5px;
  }
  .scaffold .f.is-fill { border-style: solid; border-color: rgba(143,240,201,.4); color: var(--mint); background: rgba(143,240,201,.06); }

  /* ---------- research ---------- */
  .query { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .query .chip { border-color: rgba(92,200,200,.32); color: var(--teal); }
  .srcs { display: grid; gap: 9px; }
  .src { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center;
    padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.02); font-size: 12px; }
  .src .host { color: var(--teal); font-size: 10.5px; letter-spacing: .08em; }
  .src .t { color: #ded5cb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- building ---------- */
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; height: 326px; }
  .col { display: grid; grid-template-rows: 38px 1fr 30px; border: 1px solid var(--line); border-radius: 9px;
    background: rgba(18,14,26,.86); overflow: hidden; }
  .col.is-typing { border-color: color-mix(in srgb, var(--tone, #8ff0c9) 45%, var(--line)); }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.03); font-size: 11px; }
  .col-h b { font-size: 11.5px; color: var(--ink); letter-spacing: .04em; }
  .col-h em { margin-left: auto; font-style: normal; font-size: 10px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
  .col-b { overflow: hidden; position: relative; }
  .col-b::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46px;
    background: linear-gradient(to top, rgba(18,14,26,1), transparent); }
  .code { margin: 0; padding: 10px 12px; font-size: 11px; line-height: 1.62; color: #b9b0c6;
    white-space: pre; overflow: hidden; }
  .code .k { color: var(--coral); }
  .code .s { color: var(--mint); }
  .code .c { color: #6a6279; }
  .col-f { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-top: 1px solid var(--line);
    font-size: 10px; color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
  .col-f .bar { flex: 1; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  .col-f .bar i { display: block; height: 100%; width: 0%; background: var(--tone); }
  .badge { font-size: 9px; letter-spacing: .12em; padding: 2px 6px; border-radius: 4px;
    border: 1px solid rgba(242,181,68,.35); color: var(--amber); }
  .stats { display: flex; gap: 12px; margin-top: 16px; }
  .stat { flex: 1; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.02); }
  .stat span { display: block; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #7b7389; }
  .stat b { display: block; margin-top: 5px; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- verify ---------- */
  .verify { display: grid; grid-template-columns: 1fr 1.05fr; gap: 22px; }
  .rules { display: grid; gap: 9px; align-content: start; }
  .rules .r { display: flex; gap: 10px; align-items: flex-start; font-size: 11.5px; color: #bdb4c9; line-height: 1.5;
    padding: 9px 12px; border-left: 2px solid #463a59; background: rgba(255,255,255,.02); }
  .rules .r i { color: var(--mint); font-style: normal; }
  .pass { padding: 14px 16px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
  .pass + .pass { margin-top: 12px; }
  .pass-h { display: flex; align-items: center; gap: 10px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  .pass-h b { color: var(--coral); letter-spacing: .1em; }
  .pass-h.ok b { color: var(--mint); }
  .issue { margin-top: 9px; display: grid; grid-template-columns: 104px 1fr; gap: 12px; font-size: 11.5px;
    line-height: 1.5; color: #d6cddb; }
  .issue code { color: var(--coral); font-size: 10px; letter-spacing: .02em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .fix { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--amber); letter-spacing: .08em; }
  .fix i { font-style: normal; color: var(--dim); }

  /* ---------- serve ---------- */
  .serve { display: grid; grid-template-columns: 400px 1fr; gap: 24px; height: 388px; }
  .states { display: grid; gap: 8px; align-content: start; }
  .state { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 11.5px; color: #a9a0b7; background: rgba(255,255,255,.02); }
  .state em { margin-left: auto; font-style: normal; font-size: 9.5px; letter-spacing: .14em; color: #6f6780; }
  .state.on { border-color: rgba(143,240,201,.45); color: var(--ink); }
  .state.on em { color: var(--mint); }
  .state.done .tick { color: var(--mint); }
  .logs { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #0d0a14; border: 1px solid var(--line);
    font-size: 10px; line-height: 1.7; color: #8ea89b; height: 108px; overflow: hidden; }
  .logs b { color: var(--mint); font-weight: 500; }
  .browser { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #121212; display: grid;
    grid-template-rows: 30px 1fr; }
  .browser-bar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1c1728;
    border-bottom: 1px solid var(--line); font-size: 10px; color: #8b8299; }
  .browser-bar i { width: 7px; height: 7px; border-radius: 50%; background: #4a3f5d; }
  .browser-bar .url { margin-left: 8px; padding: 3px 10px; border-radius: 5px; background: rgba(0,0,0,.35); color: #a99fc0; }
  .timer { height: 100%; display: grid; place-content: center; justify-items: center; gap: 18px; background: #121212; }
  .timer .tt { font-size: 62px; letter-spacing: .1em; color: #e6e6e6; font-variant-numeric: tabular-nums; }
  .timer .btns { display: flex; gap: 10px; }
  .timer .btns span { padding: 7px 16px; border-radius: 6px; border: 1px solid #333; color: #bbb; font-size: 11px; }
  .timer .btns span.p { background: #4a90e2; border-color: #4a90e2; color: #07121f; }
  .timer .hist { width: 300px; display: grid; gap: 6px; margin-top: 6px; }
  .timer .hist div { height: 7px; border-radius: 3px; background: #1f1f1f; overflow: hidden; }
  .timer .hist div i { display: block; height: 100%; background: #00bfa5; width: 0; }

  /* ---------- metrics ---------- */
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 6px; }
  .metric { padding: 20px 18px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.02); }
  .metric span { font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: #7b7389; }
  .metric b { display: block; margin-top: 8px; font-size: 30px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .metric b i { font-style: normal; font-size: 12px; color: var(--dim); margin-left: 4px; }
  .outro { margin-top: 26px; display: flex; align-items: center; justify-content: space-between; }
  .outro .gate { font-size: 12px; color: var(--coral); letter-spacing: .04em; }
  .outro .gate b { color: var(--ink); }
  .outro .mark { font-size: 13px; letter-spacing: .4em; color: #6f6780; text-transform: uppercase; }
  .bar2 { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 26px; background: rgba(255,255,255,.05); }
  .bar2 i { display: block; height: 100%; }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <div class="grid"></div>
    <div class="scan"></div>

    <header class="hud">
      <div class="hud-l">
        <span class="hud-mark">C</span>
        <span class="hud-b">Cortex</span>
        <span>/ build environment</span>
      </div>
      <div class="hud-r">
        <span id="chapter">overview</span>
        <span id="clock">00:00 / 00:00</span>
      </div>
    </header>

    <div id="scene"></div>

    <footer class="tape">
      <div class="tape-bar"><i id="playhead"></i></div>
      <div id="segs"></div>
    </footer>
  </div>
</div>

let idx = -1, t0 = 0, state = null, timers = [], running = true, started = 0;
const after = (ms, fn) => timers.push(setTimeout(fn, ms));

];

function mount(i) {
  clearTimers();
  idx = i;
  const s = SCENES[i];
  sceneEl.innerHTML = "";
  sceneEl.classList.remove("in");
  const api = {
    after,
    add: (html) => {
      sceneEl.insertAdjacentHTML("beforeend", `<div class="sc">${html}</div>`);
      return sceneEl.lastElementChild;
    },
  };
  state = s.enter ? s.enter(api) : null;
  void sceneEl.offsetWidth;
  sceneEl.classList.add("in");
  t0 = performance.now();
  chapterEl.textContent = s.name;
  [...segsEl.children].forEach((seg, k) => seg.classList.toggle("is-on", k === i));
  s.frame && s.frame(state, 0, 0);
}

function loop(now) {
  const s = SCENES[idx];
  if (running) {
    const dt = now - t0;
    if (dt >= s.dur) { mount((idx + 1) % SCENES.length); }
    else { s.frame && s.frame(state, dt / s.dur, dt); }
    const total = SCENES.reduce((sum, x) => sum + x.dur, 0);
    const before = SCENES.slice(0, idx).reduce((sum, x) => sum + x.dur, 0);
    const here = clamp(now - t0, 0, s.dur);
    playhead.style.width = `${((before + here) / total) * 100}%`;
    clockEl.textContent = `${clock(before + here)} / ${clock(total)}`;
  }
  requestAnimationFrame(loop);
}

        c.bar.style.width = `${q * 100}%`;
        c.node.classList.toggle("is-typing", q > 0.02 && q < 0.98);
      }
    }
    st.tok.textContent = fmt(Math.round(p * D.totals.total_tokens));
    st.call.textContent = Math.round(p * D.totals.calls);
    st.ms.textContent = `${Math.round(p * D.totals.ms / 1000)}s`;
    st.think.textContent = `${fmt(Math.round(p * D.totals.thinking_chars / 1000))}k`;
  },
});

/* ------------------------------------------------------------------ helpers */
const KEYWORDS = /\b(const|let|var|function|return|if|else|for|while|new|class|import|export|document|window|localStorage|true|false|null)\b/g;

/** Highlight one line without ever re-parsing markup it produced itself. */
function colorize(raw) {
  const code = (text) => esc(text).replace(KEYWORDS, '<span class="k">$1</span>');
  const tokens = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|"[^"\n]*"|'[^'\n]*'|`[^`\n]*`)/g;
  const out = [];
  let last = 0, match;
  while ((match = tokens.exec(raw)) !== null) {
    if (match.index > last) out.push(code(raw.slice(last, match.index)));
    const tok = match[0];
    const cls = tok.startsWith("//") || tok.startsWith("/*") ? "c" : "s";
    out.push(`<span class="${cls}">${esc(tok)}</span>`);
    last = match.index + tok.length;
  }
  out.push(code(raw.slice(last)));
  return out.join("");
}
