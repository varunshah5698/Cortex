# One Render web service: the UI is built by Vite into dist/, then the Python harness
# serves both dist/ and /api from the same origin. Render's Python runtime includes
# Node and npm, so the frontend build needs no second service.
services:
  - type: web
    name: cortex
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build && pip install -r requirements.txt
    startCommand: uvicorn ai_harness.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: src
      # Ephemeral by default. Add a Render disk and point this at its mount for runs
      # that survive a restart (free instances cannot attach disks).
      - key: HARNESS_WORKSPACE
        value: /var/tmp/cortex-workspace
      # No Chrome on the server; preview checks degrade instead of failing runs.
      - key: HARNESS_BROWSER_CHECK
        value: "0"
      - key: HARNESS_BROWSER_INTERACT
        value: "0"
      # A free instance has 512 MB. One run at a time keeps it honest.
      - key: HARNESS_MAX_CONCURRENT_RUNS
        value: "1"
      - key: HARNESS_MAX_QUEUED_RUNS
        value: "2"
      # River caps concurrency per account+model and answers 429 "account_rate".
      - key: HARNESS_PROVIDER_CONCURRENCY
        value: "1"
      # Required by the dashboard on first Blueprint sync: "user:password", or just a
      # password (user "cortex"). Without it the public URL can spend your provider keys.
      - key: HARNESS_BASIC_AUTH
        sync: false
      # Generated apps run on the separate `cortex-runner` service below. Set both values
      # to the runner's URL and the same HARNESS_RUNNER_TOKEN.
      - key: HARNESS_RUNNER_MODE
        value: cloud
      - key: HARNESS_CLOUD_RUNNER_URL
        sync: false
      - key: HARNESS_CLOUD_RUNNER_TOKEN
        sync: false

  # Per-run execution: one free web service receives a finished workspace, installs it,
  # serves it on a loopback port and proxies it under a per-run capability URL. It has no
  # harness API and no provider keys.
  - type: web
    name: cortex-runner
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai_harness.cloud_runner:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: src
      - key: HARNESS_RUNNER_WORKSPACE
        value: /var/tmp/cortex-runner
      - key: HARNESS_RUNNER_TTL
        value: "900"
      - key: HARNESS_RUNNER_MAX_RUNS
        value: "1"
      # Generate one value and put the same value on the harness service above.
      - key: HARNESS_RUNNER_TOKEN
        sync: false
