# One Render web service: the UI is built by Vite into dist/, then the Python harness
# serves both dist/ and /api from the same origin. Render's Python runtime includes
# Node and npm, so the frontend build needs no second service.
services:
  - type: web
    name: cortex
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build && pip install -r requirements.txt && npm install --prefix .vercel-cli vercel@59.10.0
    startCommand: uvicorn ai_harness.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: src
      # Ephemeral by default. Add a Render disk and point this at its mount for runs
      # that survive a restart (free instances cannot attach disks).
      - key: HARNESS_WORKSPACE
        value: /var/tmp/cortex-workspace
      # No Chrome on the server; preview checks degrade instead of failing runs.
      - key: HARNESS_BROWSER_CHECK
        value: "0"
      - key: HARNESS_BROWSER_INTERACT
        value: "0"
      # App-level accounts: sign-up / sign-in. No HTTP Basic auth.
      # Accounts and sessions live in HARNESS_AUTH_DB. `/var/tmp` is wiped on restart,
      # so the login page warns and the free plan cannot keep accounts. Upgrade the
      # instance, attach a disk, and point this at the mount to persist them:
      #
      # disk:
      #   name: cortex-data
      #   mountPath: /var/cortex-data
      #   sizeGB: 1
      #
      # - key: HARNESS_AUTH_DB
      #   value: /var/cortex-data/auth.db
      - key: HARNESS_AUTH_DB
        value: /var/tmp/cortex-auth.db
      # The API still rejects foreign browser origins and non-browser clients
      # without X-Harness-Token.
      # A free instance has 512 MB. One run at a time keeps it honest.
      - key: HARNESS_MAX_CONCURRENT_RUNS
        value: "1"
      - key: HARNESS_MAX_QUEUED_RUNS
        value: "2"
      # River caps concurrency per account+model and answers 429 "account_rate".
      - key: HARNESS_PROVIDER_CONCURRENCY
        value: "1"
      # Finished workspaces are published to the separate `cortex-runner` service, which
      # serves them at a per-run capability URL the Preview tab can embed. Set the same
      # HARNESS_RUNNER_TOKEN on both services; the URL is filled from the runner host.
      - key: HARNESS_RUNNER_MODE
        value: cloud
      - key: HARNESS_CLOUD_RUNNER_URL
        fromService:
          type: web
          name: cortex-runner
          property: host
      - key: HARNESS_CLOUD_RUNNER_TOKEN
        sync: false
      # Convex is the durable data layer (docs/convex.md): accounts, threads, runs and
      # lessons. The site URL is public; the secret is not, so it stays out of the repo.
      # Leave the secret unset and runs simply are not mirrored — the harness still works.
      - key: CONVEX_SITE_URL
        value: https://dynamic-jay-407.convex.site
      - key: CONVEX_HARNESS_SECRET
        sync: false

  # The public preview host. `cortex` above wires HARNESS_CLOUD_RUNNER_URL to this
  # service's host via fromService, so this block must exist or the Blueprint sync
  # fails with a broken fromService reference and nothing deploys at all.
  # It is deliberately not the harness: no /api, no roster, no provider keys. The only
  # credential is HARNESS_RUNNER_TOKEN, which must match on both services.
  - type: web
    name: cortex-runner
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai_harness.cloud_runner:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: src
      # One run at a time on a free instance; the TTL bounds how long a preview lives.
      - key: HARNESS_RUNNER_MAX_RUNS
        value: "1"
      - key: HARNESS_RUNNER_TTL
        value: "900"
      - key: HARNESS_RUNNER_WORKSPACE
        value: /var/tmp/cortex-runner/runs
      # Set the same value on the `cortex` service (HARNESS_CLOUD_RUNNER_TOKEN).
      - key: HARNESS_RUNNER_TOKEN
        sync: false
